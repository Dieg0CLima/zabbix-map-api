services:
  db:
    image: postgres:16-alpine
    container_name: zabbix_map_db
    environment:
      POSTGRES_DB: zabbix_map_api_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zabbix_map_api_development"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: zabbix_map_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RAILS_LOG_TO_STDOUT: "true"
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: "NYNij9S8wuEVEe7IjSIe8Oa4QYhCpIj7"
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: "FzYNfVQKGbX6U8jrizk47voiqCpY62c9"
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: "cq6F65nkbEmmCdg9KdJwM0EfeNIppyFj"
      # Banco de dados — defina DB_RESET=true para dropar e recriar na próxima subida
      DB_RESET: "false"
      # Credenciais fixas do seed (deixe em branco para gerar senha aleatória)
      DEFAULT_ADMIN_EMAIL: "admin@zabbix-map.local"
      DEFAULT_ADMIN_PASSWORD: "admin123"
      DEFAULT_ORG_ADMIN_EMAIL: "org-admin@zabbix-map.local"
      DEFAULT_ORG_ADMIN_PASSWORD: "orgadmin123"
    ports:
      - "3000:3000"
    volumes:
      - .:/app:cached
      - bundle_cache:/usr/local/bundle
    command: bin/rails server -b 0.0.0.0 -p 3000
    tty: true
    stdin_open: true
    restart: unless-stopped

volumes:
  pg_data:
  bundle_cache:
